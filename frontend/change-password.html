<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Change Password</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .cpw-box { background:var(--white); border-radius:var(--radius-lg); padding:36px; width:440px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:18px; }
    .cpw-icon { width:52px; height:52px; border-radius:50%; background:var(--amber-100); display:flex; align-items:center; justify-content:center; }
    .cpw-icon i { font-size:26px; color:var(--gold-dark); }
    .cpw-title { font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--gray-900); }
    .cpw-sub { font-size:13px; color:var(--gray-600); margin-top:-12px; }
    .pw-rules { background:var(--gray-50); border-radius:var(--radius-sm); padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
    .pw-rules-title { font-size:12px; font-weight:500; color:var(--gray-600); margin-bottom:3px; }
    .pw-rule { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--gray-400); transition:color .2s; }
    .pw-rule.valid { color:var(--navy-light); }
    .pw-rule i { font-size:14px; }
    .cpw-btn { height:42px; background:var(--navy); color:var(--gold); border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; font-family:var(--font-display); cursor:pointer; width:100%; transition:opacity .15s; }
    .cpw-btn:hover { opacity:.88; }
    .cpw-btn:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
<div class="cpw-box">
  <div class="cpw-icon"><i class="ti ti-lock"></i></div>
  <p class="cpw-title">Change your password</p>
  <p class="cpw-sub">You must set a new password before continuing.</p>
  <div class="alert alert-amber">
    <i class="ti ti-alert-triangle"></i>
    This is your first login. Please change your password to something only you know. Do not share it with anyone.
  </div>
  <div class="form-group">
    <label>Current password</label>
    <input type="password" id="current-pw" placeholder="Enter current password">
  </div>
  <div class="form-group">
    <label>New password</label>
    <input type="password" id="new-pw" placeholder="Enter new password" oninput="checkRules()">
  </div>
  <div class="form-group">
    <label>Confirm new password</label>
    <input type="password" id="confirm-pw" placeholder="Re-enter new password" oninput="checkMatch()">
  </div>
  <div class="pw-rules">
    <p class="pw-rules-title">Password must have:</p>
    <div class="pw-rule" id="rule-length"><i class="ti ti-circle"></i> At least 8 characters</div>
    <div class="pw-rule" id="rule-upper"><i class="ti ti-circle"></i> At least 1 uppercase letter</div>
    <div class="pw-rule" id="rule-number"><i class="ti ti-circle"></i> At least 1 number</div>
    <div class="pw-rule" id="rule-match"><i class="ti ti-circle"></i> Passwords match</div>
  </div>
  <button class="cpw-btn" id="cpw-btn" onclick="submitChange()" disabled>Set new password</button>
</div>
<script>
  function setRule(id, valid, text) {
    const el = document.getElementById(id);
    el.classList.toggle('valid', valid);
    el.innerHTML = valid ? `<i class="ti ti-circle-check"></i> ${text}` : `<i class="ti ti-circle"></i> ${text}`;
  }
  function checkRules() {
    const pw = document.getElementById('new-pw').value;
    setRule('rule-length', pw.length >= 8,       'At least 8 characters');
    setRule('rule-upper',  /[A-Z]/.test(pw),     'At least 1 uppercase letter');
    setRule('rule-number', /[0-9]/.test(pw),     'At least 1 number');
    checkMatch();
  }
  function checkMatch() {
    const pw = document.getElementById('new-pw').value;
    const c  = document.getElementById('confirm-pw').value;
    const valid = pw && c && pw === c;
    setRule('rule-match', valid, 'Passwords match');
    const allValid = pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && valid;
    document.getElementById('cpw-btn').disabled = !allValid;
  }
  function submitChange() {
    const btn = document.getElementById('cpw-btn');
    btn.textContent = 'Saving...';
    btn.disabled = true;
    setTimeout(() => {
      alert('Password changed successfully! Welcome to Arkheion.');
      window.location.href = 'dashboard.html';
    }, 800);
  }
</script>
</body>
</html>
