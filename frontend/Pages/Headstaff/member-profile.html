<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Senior Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex}.profile-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--teal-50);color:var(--navy);font-size:20px;font-weight:700}.profile-title{flex:1;min-width:220px}.profile-title h1{font-size:21px;margin:2px 0 5px;color:var(--gray-900)}.profile-sub{font-size:12.5px;color:var(--gray-500)}.profile-actions{margin-left:auto}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.profile-field{padding:12px;background:var(--gray-50);border-radius:8px;min-width:0}.profile-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);margin-bottom:5px}.profile-value{font-size:13px;font-weight:550;color:var(--gray-800);overflow-wrap:anywhere}.history-wrap{overflow:auto}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--gray-200);font-size:12px;white-space:nowrap}.history-table th{color:var(--gray-500);font-weight:600}.history-empty{padding:24px;text-align:center;color:var(--gray-500);font-size:13px}.history-filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}.history-filters select{min-height:34px;padding:6px 9px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;color:var(--gray-800);font-size:12px}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:15px}.timeline-dot{width:10px;height:10px;border-radius:50%;margin:4px auto 0;background:var(--teal,#1f8a83);box-shadow:0 0 0 4px var(--teal-50,#e7f5f3)}.timeline-text{font-size:12.5px;color:var(--gray-700);line-height:1.45}.timeline-date{font-size:11px;color:var(--gray-500);margin-top:3px}.profile-note{padding:11px 13px;border-radius:8px;background:#eff6ff;color:#1e40af;font-size:12px;line-height:1.5}.error-box{padding:28px;text-align:center;color:var(--gray-600)}@media(max-width:800px){.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.profile-grid{grid-template-columns:1fr}.profile-actions{margin-left:0}}
  </style>
</head>
<body>
<script src="sidebar-headstaff.js"></script>
<main class="main">
  <div class="topbar"><a href="member-records.html" class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left"></i> Member records</a><span class="topbar-title" style="margin-left:12px">Senior profile</span></div>
  <div class="content" id="profileContent"><section class="card error-box">Loading senior profile…</section></div>
</main>
<script src="../api.js"></script>
<script>
  renderHeadStaffSidebar('member-records');
  let pensionRecords = [];
  let seniorRecord = null;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const asArray = data => Array.isArray(data) ? data : (data && Array.isArray(data.results) ? data.results : []);
  const fullName = record => [record.first_name, record.middle_name, record.last_name].filter(Boolean).join(' ');
  function fmtDate(value) {
    if (!value) return '—';
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.valueOf()) ? esc(value) : date.toLocaleDateString('en-PH', {year:'numeric',month:'short',day:'numeric'});
  }
  function getPeriodParts(record) {
    const period = String(record.period || '');
    const iso = period.match(/^(\d{4})[-/](\d{1,2})/);
    if (iso) return {year:iso[1], month:iso[2].padStart(2,'0')};
    const date = new Date(period);
    return Number.isNaN(date.valueOf()) ? {year:'',month:''} : {year:String(date.getFullYear()),month:String(date.getMonth()+1).padStart(2,'0')};
  }
  function statusLabel(record) { return record.claimed ? 'Claimed' : 'Unclaimed'; }
  function renderPensionHistory() {
    const yearSelect = document.getElementById('pensionYear');
    if (!yearSelect) return;
    const years = [...new Set(pensionRecords.map(getPeriodParts).map(parts => parts.year).filter(Boolean))].sort().reverse();
    const previousYear = yearSelect.value;
    yearSelect.innerHTML = '<option value="">All years</option>' + years.map(year => `<option value="${esc(year)}">${esc(year)}</option>`).join('');
    yearSelect.value = years.includes(previousYear) ? previousYear : '';
    const year = yearSelect.value;
    const month = document.getElementById('pensionMonth').value;
    const status = document.getElementById('pensionStatus').value;
    const rows = pensionRecords.filter(record => {
      const parts = getPeriodParts(record);
      return (!year || parts.year === year) && (!month || parts.month === month) && (!status || statusLabel(record) === status);
    });
    document.getElementById('pensionRows').innerHTML = rows.map(record => `<tr>
      <td>${esc(record.period || '—')}</td>
      <td>₱${Number(record.amount || 0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td><span class="badge ${record.claimed ? 'badge-ok' : 'badge-pend'}">${statusLabel(record)}</span></td>
      <td>${fmtDate(record.date_claimed)}</td>
      <td>${esc(record.representative || record.claimed_by || '—')}</td>
      <td>${esc(record.remarks || 'Staff record')}</td>
    </tr>`).join('');
    document.getElementById('pensionEmpty').hidden = rows.length > 0;
    document.getElementById('pensionResultCount').textContent = `Showing ${rows.length} of ${pensionRecords.length} pension records`;
  }
  function renderProfile(record, deaths, transfers) {
    seniorRecord = record;
    const name = fullName(record) || 'Unnamed senior citizen';
    const death = deaths.find(item => Number(item.senior_citizen) === Number(record.id));
    const seniorTransfers = transfers.filter(item => Number(item.senior_citizen) === Number(record.id));
    const fields = [
      ['OSCA ID',record.osca_id],['Registration certificate',record.registration_cert_no],['Barangay',record.barangay_name],
      ['Date of birth',fmtDate(record.date_of_birth)],['Age',record.age],['Sex',record.sex === 'M' ? 'Male' : record.sex === 'F' ? 'Female' : record.sex],
      ['Civil status',record.civil_status],['Address',record.address],['Registered on',fmtDate(record.date_of_registration)],
      ['Registration status',record.registration_status],['Senior record',record.is_active ? 'Active' : 'Inactive'],
      ['Portal account',record.has_portal_account ? 'Generated' : 'Not generated'],['Milestone age',record.milestone_age],
    ];
    const timeline = [
      {date:record.date_of_registration, title:'Senior record registered'},
      ...seniorTransfers.map(item => ({date:item.transfer_date,title:`Residence transfer recorded${item.from_barangay_name ? ` from ${item.from_barangay_name}` : ''}${item.to_barangay_name ? ` to ${item.to_barangay_name}` : item.destination_municipality ? ` to ${item.destination_municipality}` : ''}`})),
      ...pensionRecords.map(item => ({date:item.date_claimed || item.period,title:`Pension ${statusLabel(item).toLowerCase()} · ${item.period || 'period not specified'} · ₱${Number(item.amount || 0).toLocaleString('en-PH')}`})),
    ];
    if (death) timeline.push({date:death.date_of_death,title:'Death record registered'});
    timeline.sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
    const root = document.getElementById('profileContent');
    root.innerHTML = `
      <section class="card"><div class="card-body"><div class="profile-top"><div class="profile-avatar">${esc(name.split(/\s+/).map(part=>part[0]).slice(0,2).join('').toUpperCase())}</div><div class="profile-title"><h1>${esc(name)}</h1><div class="profile-sub">${esc(record.osca_id)} · ${esc(record.barangay_name || 'No barangay recorded')}</div><div style="margin-top:9px"><span class="badge ${record.is_active ? 'badge-ok' : 'badge-miss'}">${record.is_active ? 'Active record' : 'Inactive record'}</span>${death ? ' <span class="badge badge-miss">Deceased</span>' : ''}</div></div><div class="profile-actions"><a class="btn btn-ghost btn-sm" href="member-records.html"><i class="ti ti-arrow-left"></i> Back to records</a></div></div></div></section>
      <div class="profile-note" style="margin:12px 0">This profile shows the information currently available in OSCA records. Membership classification, contact number, and uploaded document history are not included in the current senior-record API.</div>
      <section class="card"><div class="card-header"><div><div class="card-title">Senior background</div><div class="card-subtitle">Personal details and account status from the backend.</div></div></div><div class="card-body"><div class="profile-grid">${fields.map(([label,value])=>`<div class="profile-field"><div class="profile-label">${esc(label)}</div><div class="profile-value">${esc(value ?? '—')}</div></div>`).join('')}</div>${death ? `<div class="profile-note" style="margin-top:14px">Death record on file: ${fmtDate(death.date_of_death)}${death.notes ? ` · ${esc(death.notes)}` : ''}</div>` : ''}</div></section>
      <section class="card"><div class="card-header" style="gap:10px;flex-wrap:wrap"><div><div class="card-title">Pension history</div><div class="card-subtitle">Backend pension records for this senior.</div></div><div class="history-filters"><select id="pensionYear" onchange="renderPensionHistory()"><option value="">All years</option></select><select id="pensionMonth" onchange="renderPensionHistory()"><option value="">All months</option><option value="01">January</option><option value="02">February</option><option value="03">March</option><option value="04">April</option><option value="05">May</option><option value="06">June</option><option value="07">July</option><option value="08">August</option><option value="09">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select><select id="pensionStatus" onchange="renderPensionHistory()"><option value="">All statuses</option><option>Claimed</option><option>Unclaimed</option></select></div></div><div style="padding:0 16px 10px;color:var(--gray-500);font-size:11px" id="pensionResultCount"></div><div class="history-wrap"><table class="history-table"><thead><tr><th>Period</th><th>Amount</th><th>Status</th><th>Date claimed</th><th>Claimed by</th><th>Remarks</th></tr></thead><tbody id="pensionRows"></tbody></table><div id="pensionEmpty" class="history-empty" hidden>No pension history matches these filters.</div></div></section>
      <section class="card"><div class="card-header"><div><div class="card-title">Record timeline</div><div class="card-subtitle">Registration, residence transfers, pension, and death records.</div></div></div><div class="card-body"><div class="timeline">${timeline.length ? timeline.map(item=>`<div class="timeline-item"><div class="timeline-dot" style="${item.title.startsWith('Death')?'background:#dc2626':''}"></div><div class="timeline-text">${esc(item.title)}<div class="timeline-date">${fmtDate(item.date)}</div></div></div>`).join('') : '<div class="history-empty">No history records found.</div>'}</div></div></section>`;
    renderPensionHistory();
  }
  async function loadProfile() {
    const root = document.getElementById('profileContent');
    const id = new URLSearchParams(location.search).get('id');
    if (!id || !/^\d+$/.test(id)) {
      root.innerHTML = '<section class="card error-box">A valid senior record was not selected. Return to the member directory and choose a record.</section>';
      return;
    }
    try {
      await ArkheionAPI.getStaffContext();
      const results = await Promise.all([
        ArkheionAPI.get(`/api/seniors/${encodeURIComponent(id)}/`),
        ArkheionAPI.get(`/api/pensions/?senior=${encodeURIComponent(id)}`),
        ArkheionAPI.get('/api/deaths/'),
        ArkheionAPI.get('/api/transfers/'),
      ]);
      pensionRecords = asArray(results[1]);
      renderProfile(results[0], asArray(results[2]), asArray(results[3]));
    } catch (error) {
      root.innerHTML = `<section class="card error-box">Could not load this senior profile.<br><span>${esc(error.message || 'Check the server and sign-in, then refresh.')}</span><br><a class="btn btn-navy btn-sm" style="margin-top:12px" href="member-records.html">Return to directory</a></section>`;
    }
  }
  loadProfile();
</script>
</body>
</html>
