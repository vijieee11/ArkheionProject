<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arkheion — Member Profile</title><link rel="stylesheet" href="styles.css"><style>
body{display:flex}.profile-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--teal-50);color:var(--navy);font-size:20px;font-weight:700}.profile-title{flex:1;min-width:220px}.profile-title h1{font-size:21px;margin:2px 0 5px;color:var(--gray-900)}.profile-sub{font-size:12.5px;color:var(--gray-500)}.profile-actions{margin-left:auto}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.profile-field{padding:12px;background:var(--gray-50);border-radius:8px;min-width:0}.profile-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);margin-bottom:5px}.profile-value{font-size:13px;font-weight:550;color:var(--gray-800);overflow-wrap:anywhere}.history-wrap{overflow:auto}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--gray-200);font-size:12px;white-space:nowrap}.history-table th{color:var(--gray-500);font-weight:600}.history-empty{padding:24px;text-align:center;color:var(--gray-500);font-size:13px}.history-filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}.history-filters select{min-height:34px;padding:6px 9px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;color:var(--gray-800);font-size:12px}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:15px}.timeline-dot{width:10px;height:10px;border-radius:50%;margin:4px auto 0;background:var(--teal,#1f8a83);box-shadow:0 0 0 4px var(--teal-50,#e7f5f3)}.timeline-text{font-size:12.5px;color:var(--gray-700);line-height:1.45}.timeline-date{font-size:11px;color:var(--gray-500);margin-top:3px}.profile-note{padding:11px 13px;border-radius:8px;background:#eff6ff;color:#1e40af;font-size:12px;line-height:1.5}.error-box{padding:28px;text-align:center;color:var(--gray-600)}@media(max-width:800px){.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.profile-grid{grid-template-columns:1fr}}
</style></head><body>
<script src="sidebar-headstaff.js"></script><main class="main"><div class="topbar"><a href="member-records.html" class="btn btn-ghost btn-sm"><i class="ti ti-arrow-left"></i> Member records</a><span class="topbar-title" style="margin-left:12px">Member profile</span></div>
<div class="content" id="profileContent"></div></main>
<script>
renderHeadStaffSidebar('member-records');
const DEMO_MEMBERS=[
 {osca:'2024-001',name:'Juan dela Cruz',barangay:'Ising (Pob.)',age:72,sex:'Male',birthdate:'1954-03-12',civil:'Married',address:'Ising (Pob.), Carmen, Davao del Norte',contact:'Not provided',membership:'Member',registered:'2024-01-15',pension:'Active'},
 {osca:'2023-087',name:'Maria Santos',barangay:'Tuganay',age:68,sex:'Female',birthdate:'1958-08-22',civil:'Widowed',address:'Tuganay, Carmen, Davao del Norte',contact:'Not provided',membership:'Member',registered:'2023-06-03',pension:'Active'},
 {osca:'2024-033',name:'Pedro Ramos',barangay:'Alejal',age:75,sex:'Male',birthdate:'1951-11-09',civil:'Married',address:'Alejal, Carmen, Davao del Norte',contact:'Not provided',membership:'Member',registered:'2024-02-10',pension:'For follow-up'},
 {osca:'2022-114',name:'Lourdes Garcia',barangay:'Asuncion',age:81,sex:'Female',birthdate:'1945-04-18',civil:'Widowed',address:'Asuncion, Carmen, Davao del Norte',contact:'Not provided',membership:'Member',registered:'2022-09-27',pension:'For follow-up'},
 {osca:'2024-056',name:'Wyndell Joshua Camacho',barangay:'Tuganay',age:63,sex:'Male',birthdate:'1963-01-30',civil:'Single',address:'Tuganay, Carmen, Davao del Norte',contact:'Not provided',membership:'Non-member',registered:'2024-04-11',pension:'Not enrolled'}
];
const readArray=key=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getMember(id){let m=DEMO_MEMBERS.find(x=>x.osca===id)||null;const s=readArray('ark_record_submissions').find(x=>x.oscaId===id&&x.status==='Approved');if(s)m={osca:s.oscaId,name:s.name||'Unnamed resident',barangay:s.barangay||'—',age:Number(s.age)||'—',sex:s.sex||'Not provided',birthdate:s.dateOfBirth||'',civil:s.civilStatus||'Not provided',address:s.address||'Not provided',contact:s.contact||'Not provided',membership:s.membershipStatus||'Member',registered:s.submittedAt||'',pension:'Not recorded'};return m;}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.valueOf())?esc(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});}
let currentPensionHistory=[];
function render(){const id=new URLSearchParams(location.search).get('id');const m=getMember(id);const root=document.getElementById('profileContent');if(!m){root.innerHTML='<div class="card error-box">Member not found. The record may not be approved yet.<br><a class="btn btn-navy btn-sm" style="margin-top:12px" href="member-records.html">Return to directory</a></div>';return;}
const death=readArray('ark_death_records').find(d=>(d.oscaId||d.osca||d.osca_id)===m.osca&&d.status==='Verified');
const history=readArray('ark_pension_history').filter(h=>h.osca===m.osca);
const seeded={
 '2024-001':[{period:'July 2026',amount:500,status:'Claimed',date:'2026-07-05',claimedBy:'Self',source:'Sample record'}],
 '2023-087':[{period:'July 2026',amount:500,status:'Claimed',date:'2026-07-07',claimedBy:'Son',source:'Sample record'},{period:'June 2026',amount:500,status:'Unclaimed',date:'',claimedBy:'',source:'Sample record'}],
 '2024-033':[{period:'July 2026',amount:500,status:'Unclaimed',date:'',claimedBy:'',source:'Sample record'}],
 '2022-114':[{period:'July 2026',amount:500,status:'Urgent follow-up',date:'',claimedBy:'',source:'Sample record'}]
}[m.osca]||[];
const combined=[...seeded,...history].sort((a,b)=>String(b.date||b.period||'').localeCompare(String(a.date||a.period||'')));
currentPensionHistory=combined;
const status=death?'Deceased':(m.membership==='Member'?'Active':'Non-member');
const fields=[['OSCA ID',m.osca],['Barangay',m.barangay],['Age',m.age],['Date of birth',fmtDate(m.birthdate)],['Sex',m.sex],['Civil status',m.civil],['Address',m.address],['Contact number',m.contact],['Membership',m.membership],['Pension status',death?'Review required':m.pension],['Record registered',fmtDate(m.registered)],['Record status',status]];
root.innerHTML=`<section class="card"><div class="card-body"><div class="profile-top"><div class="profile-avatar">${esc(m.name.split(/\s+/).map(n=>n[0]).slice(0,2).join('').toUpperCase())}</div><div class="profile-title"><h1>${esc(m.name)}</h1><div class="profile-sub">${esc(m.osca)} · ${esc(m.barangay)}</div><div style="margin-top:9px"><span class="badge ${death?'badge-miss':m.membership==='Member'?'badge-ok':'badge-pend'}">${esc(status)}</span></div></div><div class="profile-actions"><a class="btn btn-ghost btn-sm" href="member-records.html"><i class="ti ti-arrow-left"></i> Back to records</a></div></div></div></section>
<div class="profile-note" style="margin:12px 0"><strong>Privacy reminder:</strong> This profile displays sensitive senior-citizen and pension information. In the real system, restrict access to authorized staff and record every view or change.</div>
<section class="card"><div class="card-header"><div><div class="card-title">Member background</div><div class="card-subtitle">Personal and registration details available in this demo.</div></div></div><div class="card-body"><div class="profile-grid">${fields.map(([label,value])=>`<div class="profile-field"><div class="profile-label">${esc(label)}</div><div class="profile-value">${esc(value||'—')}</div></div>`).join('')}</div>${death?`<div class="profile-note" style="margin-top:14px">Verified death report on file: ${fmtDate(death.dateOfDeath)}. Check the pension record with the responsible office; this demo does not suspend or change any benefit.</div>`:''}</div></section>
<section class="card"><div class="card-header" style="gap:10px;flex-wrap:wrap"><div><div class="card-title">Pension history</div><div class="card-subtitle">Past and current benefit records associated with this OSCA ID.</div></div><div class="history-filters"><select id="pensionYear" onchange="renderPensionHistory()"><option value="">All years</option></select><select id="pensionMonth" onchange="renderPensionHistory()"><option value="">All months</option><option value="01">January</option><option value="02">February</option><option value="03">March</option><option value="04">April</option><option value="05">May</option><option value="06">June</option><option value="07">July</option><option value="08">August</option><option value="09">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select><select id="pensionStatus" onchange="renderPensionHistory()"><option value="">All statuses</option><option>Claimed</option><option>Unclaimed</option><option>Urgent follow-up</option></select></div></div><div style="padding:0 16px 10px;color:var(--gray-500);font-size:11px" id="pensionResultCount"></div><div class="history-wrap"><table class="history-table"><thead><tr><th>Period</th><th>Amount</th><th>Status</th><th>Date claimed</th><th>Claimed by</th><th>Record</th></tr></thead><tbody id="pensionRows"></tbody></table><div id="pensionEmpty" class="history-empty" hidden>No pension history matches these filters.</div></div></section>
<section class="card"><div class="card-header"><div><div class="card-title">Record timeline</div><div class="card-subtitle">Key events shown in this profile.</div></div></div><div class="card-body"><div class="timeline"><div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-text">Member record added${m.registered?' to the system':''}<div class="timeline-date">${fmtDate(m.registered)}</div></div></div>${combined.map(h=>`<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-text">${esc(h.status||'Pension update')} — ${esc(h.period||'pension record')} · ₱${Number(h.amount||0).toLocaleString('en-PH')}<div class="timeline-date">${fmtDate(h.date||'')}</div></div></div>`).join('')}${death?`<div class="timeline-item"><div class="timeline-dot" style="background:#dc2626"></div><div class="timeline-text">Death report verified<div class="timeline-date">Date of death: ${fmtDate(death.dateOfDeath)}</div></div></div>`:''}</div></div></section>`;
  renderPensionHistory();
}
function pensionDateParts(record){let date=record.date?new Date(record.date):new Date(record.period||'');if(Number.isNaN(date.valueOf()))return {year:'',month:''};return {year:String(date.getFullYear()),month:String(date.getMonth()+1).padStart(2,'0')};}
function renderPensionHistory(){
  const yearSelect=document.getElementById('pensionYear');if(!yearSelect)return;
  const years=[...new Set(currentPensionHistory.map(h=>pensionDateParts(h).year).filter(Boolean))].sort().reverse();const selectedYear=yearSelect.value;
  yearSelect.innerHTML='<option value="">All years</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join('');yearSelect.value=years.includes(selectedYear)?selectedYear:'';
  const year=yearSelect.value,month=document.getElementById('pensionMonth').value,status=document.getElementById('pensionStatus').value;
  const rows=currentPensionHistory.filter(h=>{const parts=pensionDateParts(h);return(!year||parts.year===year)&&(!month||parts.month===month)&&(!status||String(h.status||'').toLowerCase()===status.toLowerCase());});
  document.getElementById('pensionRows').innerHTML=rows.map(h=>`<tr><td>${esc(h.period||'—')}</td><td>₱${Number(h.amount||0).toLocaleString('en-PH')}</td><td><span class="badge ${h.status==='Claimed'?'badge-ok':h.status==='Urgent follow-up'?'badge-miss':'badge-pend'}">${esc(h.status||'—')}</span></td><td>${fmtDate(h.date)}</td><td>${esc(h.claimedBy||'—')}</td><td>${esc(h.source||'Staff entry')}</td></tr>`).join('');
  document.getElementById('pensionEmpty').hidden=rows.length>0;document.getElementById('pensionResultCount').textContent=`Showing ${rows.length} of ${currentPensionHistory.length} pension records`;
}
render();window.addEventListener('storage',e=>{if(['ark_pension_history','ark_record_submissions','ark_death_records'].includes(e.key))render();});
</script></body></html>
