<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Audit Log</title>
  <link rel="stylesheet" href="output.css">
  <style>
    body{display:flex;}
    .audit-table th { padding: 13px 18px; font-size: 12px; }
    .audit-table td { padding: 17px 18px; font-size: 13.5px; border: .5px solid var(--gray-200); border-left:none; border-right:none; }
    .audit-badge { display:inline-block; font-size:12px; font-weight:600; padding:5px 12px; border-radius:6px; }
    .audit-badge.b-login  { background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-create { background:var(--blue-50);   color:var(--blue-900); }
    .audit-badge.b-upload { background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-edit   { background:var(--amber-100); color:var(--amber-600); }
    .audit-badge.b-search { background:var(--blue-50);   color:var(--blue-900); }
    .audit-badge.b-approve{ background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-delete { background:var(--coral-50);  color:var(--coral-900); }
  </style>
</head>
<body>
<script src="sidebar-headstaff.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Audit log — RA 10173 compliance</span>
    <div class="topbar-actions" style="margin-left:auto;">
      <button class="btn btn-ghost btn-sm" onclick="exportLog()"><i class="ti ti-download"></i> Export log</button>
    </div>
  </div>

  <div class="content">
    <div class="alert alert-blue">
      <i class="ti ti-shield-check"></i>
      All staff actions are automatically logged in compliance with Republic Act No. 10173 (Data Privacy Act of 2012). Logs cannot be deleted or modified.
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">All activity logs</div>
          <div class="card-subtitle" id="log-date-sub">July 27, 2026</div>
        </div>
        <div class="card-actions">
          <select id="filter-action" class="filter-select" onchange="renderTable()">
            <option>All actions</option>
            <option>Login/Logout</option>
            <option>Create</option>
            <option>Edit</option>
            <option>Delete</option>
            <option>Upload</option>
            <option>Search</option>
            <option>Approve</option>
          </select>
          <select id="filter-staff" class="filter-select" onchange="renderTable()">
            <option>All staff</option>
            <option>osca_head</option>
            <option>osca_staff1</option>
            <option>osca_staff2</option>
          </select>
          <input type="date" id="filter-date" class="filter-select" value="2026-07-27" onchange="renderTable()">
        </div>
      </div>
      <table class="audit-table">
        <thead>
          <tr><th>Timestamp</th><th>Staff</th><th>Action</th><th>Module</th><th>Description</th><th>IP address</th></tr>
        </thead>
        <tbody id="audit-rows"></tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--gray-200);">
        <span style="font-size:12px;color:var(--gray-500)" id="log-count">Showing 7 of 7 log entries today</span>
        <div style="display:flex;gap:4px;" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  renderHeadStaffSidebar('audit');

  // Sample audit entries — in production these come from the backend, already paginated.
  const logs = [
    { date: '2026-07-26', time: '8:47 AM',  staff: 'osca_staff2', action: 'Login/Logout', badgeClass: 'b-login',   module: 'System',    desc: 'Regular Staff 2 logged out',                                            ip: '192.168.1.3' },
    { date: '2026-07-26', time: '9:02 AM',  staff: 'osca_head',   action: 'Login/Logout', badgeClass: 'b-login',   module: 'System',    desc: 'Head Staff logged in successfully',                                    ip: '192.168.1.1' },
    { date: '2026-07-27', time: '9:10 AM',  staff: 'osca_staff1', action: 'Login/Logout', badgeClass: 'b-login',   module: 'System',    desc: 'Regular Staff 1 logged in successfully',                               ip: '192.168.1.2' },
    { date: '2026-07-27', time: '9:15 AM',  staff: 'osca_staff1', action: 'Create',       badgeClass: 'b-create',  module: 'Members',   desc: 'Registered new member: Rosario Mendoza (2025-012)',                    ip: '192.168.1.2' },
    { date: '2026-07-27', time: '9:22 AM',  staff: 'osca_head',   action: 'Create',       badgeClass: 'b-create',  module: 'Members',   desc: 'Registered new member: Felipe Torres (2023-055)',                      ip: '192.168.1.1' },
    { date: '2026-07-27', time: '9:30 AM',  staff: 'osca_staff1', action: 'Upload',       badgeClass: 'b-upload',  module: 'Documents', desc: 'Uploaded PSA birth certificate for Juan dela Cruz (2024-001)',         ip: '192.168.1.2' },
    { date: '2026-07-27', time: '9:41 AM',  staff: 'osca_staff2', action: 'Upload',       badgeClass: 'b-upload',  module: 'Documents', desc: 'Uploaded PhilSys ID for Maria Santos (2023-087)',                      ip: '192.168.1.3' },
    { date: '2026-07-27', time: '10:00 AM', staff: 'osca_head',   action: 'Edit',         badgeClass: 'b-edit',    module: 'Pension',   desc: 'Marked pension as claimed: Pedro Ramos (2024-033) — July 2026',        ip: '192.168.1.1' },
    { date: '2026-07-27', time: '10:12 AM', staff: 'osca_staff1', action: 'Edit',         badgeClass: 'b-edit',    module: 'Grocery',   desc: 'Marked grocery as received: Lourdes Garcia (2022-114)',                ip: '192.168.1.2' },
    { date: '2026-07-27', time: '10:30 AM', staff: 'osca_staff2', action: 'Delete',       badgeClass: 'b-delete',  module: 'Members',   desc: 'Requested deletion of duplicate entry for Felipe Torres',              ip: '192.168.1.3' },
    { date: '2026-07-28', time: '10:45 AM', staff: 'osca_staff1', action: 'Search',       badgeClass: 'b-search',  module: 'Records',   desc: 'Searched records: "Juan dela Cruz"',                                    ip: '192.168.1.2' },
    { date: '2026-07-28', time: '10:58 AM', staff: 'osca_head',   action: 'Search',       badgeClass: 'b-search',  module: 'Records',   desc: 'Searched records: "Brgy 4"',                                            ip: '192.168.1.1' },
    { date: '2026-07-28', time: '11:20 AM', staff: 'osca_head',   action: 'Approve',      badgeClass: 'b-approve', module: 'Members',   desc: 'Approved registration of Maria Santos (2023-087) — documents verified', ip: '192.168.1.1' },
    { date: '2026-07-30', time: '11:32 AM', staff: 'osca_head',   action: 'Approve',      badgeClass: 'b-approve', module: 'Pension',   desc: 'Approved benefit status correction for Regular Staff 2',               ip: '192.168.1.1' },
    { date: '2026-07-30', time: '11:45 AM', staff: 'osca_staff2', action: 'Login/Logout', badgeClass: 'b-login',   module: 'System',    desc: 'Regular Staff 2 logged in (first login — password change required)',   ip: '192.168.1.3' },
  ];

  let currentPage = 1;
  const pageSize = 6;

  function getFiltered() {
    const action = document.getElementById('filter-action').value;
    const staff = document.getElementById('filter-staff').value;
    const dateVal = document.getElementById('filter-date').value;

    return logs.filter(l => {
      const matchesAction = action === 'All actions' || l.action === action;
      const matchesStaff = staff === 'All staff' || l.staff === staff;
      const matchesDate = !dateVal || l.date === dateVal;
      return matchesAction && matchesStaff && matchesDate;
    });
  }

  function renderTable() {
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const filtered = getFiltered();
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    currentPage = Math.min(currentPage, totalPages);

    const start = (currentPage - 1) * pageSize;
    const pageRows = filtered.slice(start, start + pageSize);

    const dateVal = document.getElementById('filter-date').value;
    document.getElementById('log-date-sub').textContent = dateVal
      ? new Date(dateVal + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      : 'All dates';

    if (pageRows.length === 0) {
      document.getElementById('audit-rows').innerHTML = `
        <tr><td colspan="6" style="text-align:center;color:var(--gray-400);padding:30px;">No log entries match these filters.</td></tr>`;
    } else {
      document.getElementById('audit-rows').innerHTML = pageRows.map(l => `
        <tr>
          <td class="td-muted" style="white-space:nowrap">Jul 27 — ${l.time}</td>
          <td class="td-bold">${l.staff}</td>
          <td><span class="audit-badge ${l.badgeClass}">${l.action === 'Login/Logout' ? 'Login' : l.action}</span></td>
          <td class="td-muted">${l.module}</td>
          <td class="td-muted">${l.desc}</td>
          <td class="td-muted">${l.ip}</td>
        </tr>`).join('');
    }

    document.getElementById('log-count').textContent =
      `Showing ${pageRows.length} of ${filtered.length} log entries${dateVal ? ' today' : ''}`;

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    let html = `<button class="btn btn-ghost btn-sm" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})"><i class="ti ti-chevron-left"></i></button>`;
    for (let p = 1; p <= totalPages; p++) {
      html += `<button class="btn ${p === currentPage ? 'btn-navy' : 'btn-ghost'} btn-sm" onclick="goToPage(${p})">${p}</button>`;
    }
    html += `<button class="btn btn-ghost btn-sm" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})"><i class="ti ti-chevron-right"></i></button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function goToPage(p) {
    currentPage = p;
    renderPage();
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function exportLog() {
    const filtered = getFiltered();
    if (!filtered.length) {
      showToast('No log entries to export.', 'error');
      return;
    }
    const headers = ['Timestamp', 'Staff', 'Action', 'Module', 'Description', 'IP Address'];
    const csvRows = filtered.map(l => [
      `${l.date} ${l.time}`, l.staff, l.action, l.module, l.desc, l.ip
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...csvRows].join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `audit-log-${document.getElementById('filter-date').value || 'all'}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    showToast(`Exported ${filtered.length} log entr${filtered.length === 1 ? 'y' : 'ies'}.`);
  }

  renderPage();
</script>
</body>
</html>
