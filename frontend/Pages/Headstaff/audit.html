<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Audit Log</title>
  <link rel="stylesheet" href="output.css">
  <style>
    body{display:flex;}
    .audit-table th { padding: 13px 18px; font-size: 12px; }
    .audit-table td { padding: 17px 18px; font-size: 13.5px; border: .5px solid var(--gray-200); border-left:none; border-right:none; }
    .audit-badge { display:inline-block; font-size:12px; font-weight:600; padding:5px 12px; border-radius:6px; }
    .audit-badge.b-login  { background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-create { background:var(--blue-50);   color:var(--blue-900); }
    .audit-badge.b-upload { background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-edit   { background:var(--amber-100); color:var(--amber-600); }
    .audit-badge.b-search { background:var(--blue-50);   color:var(--blue-900); }
    .audit-badge.b-approve{ background:var(--teal-50);   color:var(--navy); }
    .audit-badge.b-delete { background:var(--coral-50);  color:var(--coral-900); }
  </style>
</head>
<body>
<script src="sidebar-headstaff.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Audit log — RA 10173 compliance</span>
    <div class="topbar-actions" style="margin-left:auto;">
      <button class="btn btn-ghost btn-sm" onclick="exportLog()"><i class="ti ti-download"></i> Export log</button>
    </div>
  </div>

  <div class="content">
    <div class="alert alert-blue">
      <i class="ti ti-shield-check"></i>
      All staff actions are automatically logged in compliance with Republic Act No. 10173 (Data Privacy Act of 2012). Logs cannot be deleted or modified.
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">All activity logs</div>
          <div class="card-subtitle" id="log-date-sub">July 27, 2026</div>
        </div>
        <div class="card-actions">
          <select id="filter-action" class="filter-select" onchange="renderTable()">
            <option value="">All actions</option>
            <option value="login">Login</option>
            <option value="logout">Logout</option>
            <option value="create">Create</option>
            <option value="edit">Edit</option>
            <option value="delete">Delete</option>
            <option value="upload">Upload</option>
            <option value="search">Search</option>
            <option value="approve">Approve</option>
          </select>
          <select id="filter-staff" class="filter-select" onchange="renderTable()">
            <option value="">All staff</option>
          </select>
          <input type="date" id="filter-date" class="filter-select" onchange="loadLogs(1)">
        </div>
      </div>
      <table class="audit-table">
        <thead>
          <tr><th>Timestamp</th><th>Staff</th><th>Action</th><th>Module</th><th>Description</th><th>IP address</th></tr>
        </thead>
        <tbody id="audit-rows"></tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--gray-200);">
        <span style="font-size:12px;color:var(--gray-500)" id="log-count">Showing 7 of 7 log entries today</span>
        <div style="display:flex;gap:4px;" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="../api.js"></script>
<script>
  renderHeadStaffSidebar('audit');

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const actionLabels = {login:'Login',logout:'Logout',create:'Create',edit:'Edit',delete:'Delete',upload:'Upload',search:'Search',approve:'Approve'};
  let currentPage = 1;
  let totalCount = 0;
  const pageSize = 25;

  async function loadStaffOptions() {
    try {
      const staff = await ArkheionAPI.get('/api/staff/');
      const select = document.getElementById('filter-staff');
      (Array.isArray(staff) ? staff : []).forEach(person => {
        const option = new Option(person.username, person.username);
        select.add(option);
      });
    } catch (_) { /* Audit list still works without the optional staff filter choices. */ }
  }

  function selectedLogFilters() {
    return {
      action: document.getElementById('filter-action').value,
      user: document.getElementById('filter-staff').value,
      date: document.getElementById('filter-date').value,
    };
  }

  async function loadLogs(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({page:String(page), page_size:String(pageSize)});
    Object.entries(selectedLogFilters()).forEach(([key,value]) => { if (value) params.set(key,value); });
    const tbody = document.getElementById('audit-rows');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:28px">Loading audit entries…</td></tr>';
    try {
      const response = await ArkheionAPI.get(`/api/audit-logs/?${params.toString()}`);
      const rows = Array.isArray(response.results) ? response.results : [];
      totalCount = Number(response.count || 0);
      document.getElementById('log-date-sub').textContent = selectedLogFilters().date || 'All dates';
      tbody.innerHTML = rows.length ? rows.map(entry => {
        const date = new Date(entry.timestamp);
        const badgeClass = entry.action === 'delete' ? 'b-delete' : entry.action === 'edit' ? 'b-edit' : entry.action === 'upload' ? 'b-upload' : entry.action === 'approve' ? 'b-approve' : entry.action === 'search' ? 'b-search' : entry.action === 'create' ? 'b-create' : 'b-login';
        return `<tr><td class="td-muted" style="white-space:nowrap">${escapeHtml(Number.isNaN(date.getTime()) ? entry.timestamp : date.toLocaleString())}</td><td class="td-bold">${escapeHtml(entry.staff_name)}<br><small>${escapeHtml(entry.username)}</small></td><td><span class="audit-badge ${badgeClass}">${escapeHtml(actionLabels[entry.action] || entry.action)}</span></td><td class="td-muted">${escapeHtml(entry.module)}</td><td class="td-muted">${escapeHtml(entry.description)}</td><td class="td-muted">${escapeHtml(entry.ip_address || '—')}</td></tr>`;
      }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--gray-500);padding:28px">No recorded activity matches these filters.</td></tr>';
      document.getElementById('log-count').textContent = `Showing ${rows.length ? (page - 1) * pageSize + 1 : 0}–${(page - 1) * pageSize + rows.length} of ${totalCount} recorded entries`;
      renderPagination(Math.max(1,Math.ceil(totalCount/pageSize)));
    } catch (error) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--coral-900);padding:28px">${escapeHtml(error.message || 'Could not load the audit log.')}</td></tr>`;
      document.getElementById('log-count').textContent = 'Audit log unavailable.';
      document.getElementById('pagination').replaceChildren();
    }
  }

  function renderPagination(totalPages) {
    const host = document.getElementById('pagination');
    host.innerHTML = `<button class="btn btn-ghost btn-sm" ${currentPage<=1?'disabled':''} onclick="loadLogs(${currentPage-1})">‹</button><span style="padding:6px 9px;font-size:12px">Page ${currentPage} of ${totalPages}</span><button class="btn btn-ghost btn-sm" ${currentPage>=totalPages?'disabled':''} onclick="loadLogs(${currentPage+1})">›</button>`;
  }

  function renderTable() { loadLogs(1); }
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast'); toast.textContent = msg; toast.className = `toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  async function exportLog() {
    const filters = selectedLogFilters();
    const rows = [];
    try {
      let page = 1;
      while (true) {
        const params = new URLSearchParams({page:String(page),page_size:'100'});
        Object.entries(filters).forEach(([key,value]) => { if(value) params.set(key,value); });
        const response = await ArkheionAPI.get(`/api/audit-logs/?${params.toString()}`);
        rows.push(...(Array.isArray(response.results) ? response.results : []));
        if (!response.next) break;
        page++;
      }
      if (!rows.length) { showToast('No log entries to export.','error'); return; }
      const headers = ['Timestamp','Staff','Username','Action','Module','Record ID','Description','IP Address'];
      const csvRows = rows.map(entry => [entry.timestamp,entry.staff_name,entry.username,actionLabels[entry.action]||entry.action,entry.module,entry.record_id,entry.description,entry.ip_address].map(value=>`"${String(value ?? '').replace(/"/g,'""')}"`).join(','));
      const url=URL.createObjectURL(new Blob([[headers.join(','),...csvRows].join('\n')],{type:'text/csv;charset=utf-8;'}));
      const link=document.createElement('a');link.href=url;link.download=`audit-log-${filters.date||'all'}.csv`;link.click();URL.revokeObjectURL(url);
      showToast(`Exported ${rows.length} log entr${rows.length===1?'y':'ies'}.`);
    } catch(error) { showToast(error.message||'Could not export the audit log.','error'); }
  }

  Promise.all([loadStaffOptions(),loadLogs()]);
</script>
</body>
</html>
