<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Members</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;}
    .badge-deceased {
      background:#fee2e2;
      color:#b91c1c;
    }
  </style>
</head>
<body>
<script src="sidebar.js"></script>
<script src="../api.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Members</span>
    <div class="topbar-search">
      <i class="ti ti-search"></i>
      <input type="text" id="member-search" placeholder="Search by name, OSCA ID, barangay..." oninput="onFiltersChanged()">
    </div>
    <div class="topbar-actions">
      <select id="filter-brgy" class="filter-select" data-arkheion-barangay="filter" onchange="onFiltersChanged()">
        <option>All barangays</option>
      </select>
      <select id="filter-status" class="filter-select" onchange="onFiltersChanged()">
        <option>All status</option>
        <option>Complete</option><option>Incomplete</option><option>Pending</option>
      </select>
      <!-- NEW: life status filter -->
      <select id="filter-life" class="filter-select" onchange="onFiltersChanged()">
        <option>All members</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportMembers()"><i class="ti ti-download"></i> Export</button>
      <button class="btn btn-navy btn-sm" onclick="location.href='register.html'"><i class="ti ti-plus"></i> Register</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid stats-3">
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-users"></i> Total members</div>
        <div class="stat-value" id="total-members">—</div>
        <div class="stat-sub">All barangays</div>
      </div>
      <div class="stat-card teal">
        <div class="stat-label"><i class="ti ti-circle-check"></i> Complete</div>
        <div class="stat-value" id="complete-members">—</div>
        <div class="stat-sub">86% of total</div>
      </div>
      <div class="stat-card coral">
        <div class="stat-label"><i class="ti ti-alert-circle"></i> Incomplete</div>
        <div class="stat-value" id="incomplete-members">—</div>
        <div class="stat-sub">9 urgent cases</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">All members</div>
          <div class="card-subtitle">Click a member to view full profile</div>
        </div>
        <div class="card-actions">
          <select id="sort-select" class="filter-select" onchange="renderTable()">
            <option value="name-asc">Sort: Name A-Z</option>
            <option value="recent">Sort: Recently added</option>
            <option value="age-desc">Sort: Age (oldest)</option>
            <option value="age-asc">Sort: Age (youngest)</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>OSCA ID</th><th>Name</th><th>Age</th><th>Sex</th>
            <th>Barangay</th><th>Civil Status</th><th>Milestone</th>
            <th>Reg. Status</th><th>Life Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="members-rows"><tr><td colspan="10" style="text-align:center;padding:24px">Loading member records…</td></tr></tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--gray-200);">
        <span style="font-size:12px;color:var(--gray-500)" id="members-count">Loading members…</span>
        <div style="display:flex;gap:4px;" id="pagination-controls"></div>
      </div>
    </div>
  </div>
</div>
<script>
  renderSidebar('members');

  const PAGE_SIZE = 10;
  let currentPage = 1;
  let members = [];

  const regMeta = {
    complete:   { badge: 'badge-ok', label: 'Complete' },
    incomplete: { badge: 'badge-miss', label: 'Incomplete' },
    pending:    { badge: 'badge-pend', label: 'Pending' },
  };
  const lifeMeta = {
    active:   { badge: 'badge-ok', label: 'Active' },
    inactive: { badge: 'badge-deceased', label: 'Inactive' },
  };

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function formatTitle(value) {
    if (!value) return '—';
    return String(value).replace(/\b\w/g, char => char.toUpperCase());
  }

  function normalizeMember(record) {
    const name = [record.first_name, record.middle_name, record.last_name].filter(Boolean).join(' ');
    return {
      id: record.id,
      osca: record.osca_id || '',
      name: name || 'Unnamed senior',
      age: Number.isFinite(Number(record.age)) ? Number(record.age) : null,
      sex: record.sex === 'M' ? 'Male' : record.sex === 'F' ? 'Female' : '—',
      brgy: record.barangay_name || 'Unassigned',
      civil: formatTitle(record.civil_status),
      milestone: record.milestone_age ? `${record.milestone_age}+` : '',
      reg: regMeta[record.registration_status] ? record.registration_status : 'pending',
      life: record.is_active ? 'active' : 'inactive',
      dateAdded: record.created_at || record.date_of_registration || '',
    };
  }

  function matchesStatusFilter(member, value) {
    if (value === 'All status') return true;
    if (value === 'Incomplete') return member.reg === 'incomplete';
    return member.reg === value.toLowerCase();
  }

  function onFiltersChanged() {
    currentPage = 1;
    renderTable();
  }

  function goToPage(page, totalPages) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderTable();
  }

  function renderPagination(totalPages) {
    const el = document.getElementById('pagination-controls');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="btn btn-ghost btn-sm" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1}, ${totalPages})"><i class="ti ti-chevron-left"></i></button>`;
    for (let page = 1; page <= totalPages; page++) {
      html += `<button class="btn ${currentPage === page ? 'btn-navy' : 'btn-ghost'} btn-sm" onclick="goToPage(${page}, ${totalPages})">${page}</button>`;
    }
    html += `<button class="btn btn-ghost btn-sm" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1}, ${totalPages})"><i class="ti ti-chevron-right"></i></button>`;
    el.innerHTML = html;
  }

  function renderTable() {
    const query = document.getElementById('member-search').value.trim().toLowerCase();
    const barangay = document.getElementById('filter-brgy').value;
    const status = document.getElementById('filter-status').value;
    const life = document.getElementById('filter-life').value;
    const sortBy = document.getElementById('sort-select').value;

    let rows = members.filter(member => {
      const matchesQuery = !query || [member.name, member.osca, member.brgy].some(value => value.toLowerCase().includes(query));
      const matchesBarangay = barangay === 'All barangays' || member.brgy === barangay;
      const matchesLife = life === 'All members' || member.life === life.toLowerCase();
      return matchesQuery && matchesBarangay && matchesStatusFilter(member, status) && matchesLife;
    });

    rows = rows.slice().sort((a, b) => {
      if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
      if (sortBy === 'age-desc') return (b.age ?? -1) - (a.age ?? -1);
      if (sortBy === 'age-asc') return (a.age ?? Number.MAX_SAFE_INTEGER) - (b.age ?? Number.MAX_SAFE_INTEGER);
      if (sortBy === 'recent') return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
      return 0;
    });

    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(currentPage, 1), totalPages);
    const startIndex = (currentPage - 1) * PAGE_SIZE;
    const pageRows = rows.slice(startIndex, startIndex + PAGE_SIZE);
    const rangeStart = rows.length ? startIndex + 1 : 0;
    const rangeEnd = Math.min(startIndex + PAGE_SIZE, rows.length);
    document.getElementById('members-count').textContent = `Showing ${rangeStart}–${rangeEnd} of ${rows.length} members`;

    const tbody = document.getElementById('members-rows');
    if (!pageRows.length) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:24px">${members.length ? 'No members match these filters.' : 'No senior-citizen records found.'}</td></tr>`;
      renderPagination(totalPages);
      return;
    }

    tbody.innerHTML = pageRows.map(member => {
      const registration = regMeta[member.reg];
      const lifeStatus = lifeMeta[member.life];
      return `<tr>
        <td class="td-muted">${escapeHTML(member.osca)}</td>
        <td class="td-bold">${escapeHTML(member.name)}</td>
        <td class="td-muted">${member.age ?? '—'}</td>
        <td class="td-muted">${escapeHTML(member.sex)}</td>
        <td class="td-muted">${escapeHTML(member.brgy)}</td>
        <td class="td-muted">${escapeHTML(member.civil)}</td>
        <td>${member.milestone ? `<span class="badge badge-urgent">${escapeHTML(member.milestone)}</span>` : '—'}</td>
        <td><span class="badge ${registration.badge}">${registration.label}</span></td>
        <td><span class="badge ${lifeStatus.badge}">${lifeStatus.label}</span></td>
        <td><button class="btn btn-ghost btn-sm btn-icon" onclick="location.href='member-detail.html?id=${encodeURIComponent(member.osca)}'" title="View"><i class="ti ti-eye"></i></button></td>
      </tr>`;
    }).join('');
    renderPagination(totalPages);
  }

  function updateSummary() {
    document.getElementById('total-members').textContent = members.length.toLocaleString();
    const complete = members.filter(member => member.reg === 'complete').length;
    const incomplete = members.length - complete;
    document.getElementById('complete-members').textContent = complete.toLocaleString();
    document.getElementById('incomplete-members').textContent = incomplete.toLocaleString();
    document.querySelector('.stat-card:nth-child(2) .stat-sub').textContent = members.length ? `${Math.round(complete * 100 / members.length)}% of total` : 'No records yet';
    document.querySelector('.stat-card:nth-child(3) .stat-sub').textContent = 'Incomplete or pending records';
  }

  function exportMembers() {
    const headers = ['OSCA ID', 'Name', 'Age', 'Sex', 'Barangay', 'Civil Status', 'Milestone', 'Reg. Status', 'Life Status'];
    const csvRows = members.map(member => [
      member.osca, member.name, member.age ?? '', member.sex, member.brgy, member.civil,
      member.milestone, regMeta[member.reg].label, lifeMeta[member.life].label,
    ].map(value => `"${String(value).replace(/"/g, '""')}"`).join(','));
    const blob = new Blob([[headers.join(','), ...csvRows].join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'members-export.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  async function loadMembers() {
    const rows = document.getElementById('members-rows');
    try {
      const response = await ArkheionAPI.get('/api/seniors/');
      const records = Array.isArray(response) ? response : (response.results || []);
      members = records.map(normalizeMember);
      updateSummary();
      renderTable();
    } catch (error) {
      rows.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:24px;color:#b91c1c">${escapeHTML(error.message || 'Could not load member records.')}</td></tr>`;
      document.getElementById('members-count').textContent = 'Member records could not be loaded';
      showToast(error.message || 'Could not load member records.', 'error');
    }
  }

  ArkheionAPI.populateBarangaySelects().catch(error => showToast(error.message || 'Could not load barangays.', 'error'));
  loadMembers();
</script>
</body>
</html>
