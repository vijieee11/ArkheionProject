<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Members</title>
  <link rel="stylesheet" href="styles.css">
  <style>body{display:flex;}</style>
</head>
<body>
<script src="sidebar.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Members</span>
    <div class="topbar-search">
      <i class="ti ti-search"></i>
      <input type="text" id="member-search" placeholder="Search by name, OSCA ID, barangay..." oninput="renderTable()">
    </div>
    <div class="topbar-actions">
      <select id="filter-brgy" class="filter-select" onchange="renderTable()">
        <option>All barangays</option>
        <option>Alejal</option>
        <option>Anibongan</option>
        <option>Asuncion</option>
        <option>Cebulano</option>
        <option>Guadalupe</option>
        <option>Ising (Poblacion)</option>
        <option>La Paz</option>
        <option>Mabaus</option>
        <option>Mabuhay</option>
        <option>Magsaysay</option>
        <option>Mangalcal</option>
        <option>Minda</option>
        <option>New Camiling</option>
        <option>Salvacion</option>
        <option>San Isidro</option>
        <option>Santo Niño</option>
        <option>Taba</option>
        <option>Tibulao</option>
        <option>Tubod</option>
        <option>Tuganay</option>
      </select>
      <select id="filter-status" class="filter-select" onchange="renderTable()">
        <option>All status</option>
        <option>Complete</option><option>Incomplete</option><option>Urgent</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="exportMembers()"><i class="ti ti-download"></i> Export</button>
      <button class="btn btn-navy btn-sm" onclick="location.href='register.html'"><i class="ti ti-plus"></i> Register</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid stats-3">
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-users"></i> Total members</div>
        <div class="stat-value">1,284</div>
        <div class="stat-sub">All barangays</div>
      </div>
      <div class="stat-card teal">
        <div class="stat-label"><i class="ti ti-circle-check"></i> Complete</div>
        <div class="stat-value">1,109</div>
        <div class="stat-sub">86% of total</div>
      </div>
      <div class="stat-card coral">
        <div class="stat-label"><i class="ti ti-alert-circle"></i> Incomplete</div>
        <div class="stat-value">175</div>
        <div class="stat-sub">9 urgent cases</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">All members</div>
          <div class="card-subtitle">Click a member to view full profile</div>
        </div>
        <div class="card-actions">
          <select id="sort-select" class="filter-select" onchange="renderTable()">
            <option value="name-asc">Sort: Name A-Z</option>
            <option value="recent">Sort: Recently added</option>
            <option value="age-desc">Sort: Age (oldest)</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>OSCA ID</th><th>Name</th><th>Age</th><th>Sex</th>
            <th>Barangay</th><th>Civil Status</th><th>Milestone</th>
            <th>Reg. Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="members-rows"></tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--gray-200);">
        <span style="font-size:12px;color:var(--gray-500)" id="members-count">Showing 6 of 1,284 members</span>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-ghost btn-sm"><i class="ti ti-chevron-left"></i></button>
          <button class="btn btn-navy btn-sm">1</button>
          <button class="btn btn-ghost btn-sm">2</button>
          <button class="btn btn-ghost btn-sm">3</button>
          <button class="btn btn-ghost btn-sm"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  renderSidebar('members');

  // Sample members — in production, fetch/sort/filter these via the backend instead.
  const members = [
    { osca: '2023-087', name: 'Juan dela Cruz',  age: 81, sex: 'M', brgy: 'Ising (Pob.)',          civil: 'Widowed', milestone: '80+', reg: 'complete', dateAdded: '2024-01-05' },
    { osca: '2024-097', name: 'Maria Santos',    age: 72, sex: 'F', brgy: 'Anibongan',         civil: 'Married', milestone: null,  reg: 'complete', dateAdded: '2023-03-10' },
    { osca: '2025-012', name: 'Rosario Mendoza', age: 68, sex: 'F', brgy: 'Tubod',             civil: 'Widowed', milestone: null,  reg: 'missing',  dateAdded: '2025-02-01' },
    { osca: '2024-033', name: 'Pedro Ramos',     age: 85, sex: 'M', brgy: 'Ising (Poblacion)',  civil: 'Widowed', milestone: '80+', reg: 'urgent',   dateAdded: '2024-04-20' },
    { osca: '2022-114', name: 'Lourdes Garcia',  age: 76, sex: 'F', brgy: 'Alejal',            civil: 'Married', milestone: null,  reg: 'complete', dateAdded: '2022-11-14' },
    { osca: '2023-055', name: 'Felipe Torres',   age: 70, sex: 'M', brgy: 'Tuganay',           civil: 'Married', milestone: null,  reg: 'pending',  dateAdded: '2023-05-15' },
  ];

  const regMeta = {
    complete: { badge: 'badge-ok',     label: 'Complete' },
    missing:  { badge: 'badge-miss',   label: 'Missing ID' },
    urgent:   { badge: 'badge-urgent', label: 'Urgent' },
    pending:  { badge: 'badge-pend',   label: 'Pending' },
  };

  // "Complete"/"Incomplete"/"Urgent" in the filter maps onto our finer-grained
  // reg statuses: anything that isn't "complete" counts as Incomplete.
  function matchesStatusFilter(m, filterValue) {
    if (filterValue === 'All status') return true;
    if (filterValue === 'Complete') return m.reg === 'complete';
    if (filterValue === 'Urgent') return m.reg === 'urgent';
    if (filterValue === 'Incomplete') return m.reg !== 'complete';
    return true;
  }

  function renderTable() {
    const q = document.getElementById('member-search').value.trim().toLowerCase();
    const brgy = document.getElementById('filter-brgy').value;
    const status = document.getElementById('filter-status').value;
    const sortBy = document.getElementById('sort-select').value;

    let rows = members.filter(m => {
      const matchesQuery = !q ||
        m.name.toLowerCase().includes(q) ||
        m.osca.toLowerCase().includes(q) ||
        m.brgy.toLowerCase().includes(q);
      const matchesBrgy = brgy === 'All barangays' || m.brgy === brgy;
      return matchesQuery && matchesBrgy && matchesStatusFilter(m, status);
    });

    rows = rows.slice().sort((a, b) => {
      if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
      if (sortBy === 'age-desc') return b.age - a.age;
      if (sortBy === 'recent') return new Date(b.dateAdded) - new Date(a.dateAdded);
      return 0;
    });

    document.getElementById('members-count').textContent = `Showing ${rows.length} of 1,284 members`;

    document.getElementById('members-rows').innerHTML = rows.map(m => {
      const meta = regMeta[m.reg];
      const milestoneCell = m.milestone ? `<span class="badge badge-urgent">${m.milestone}</span>` : '—';
      return `
        <tr>
          <td class="td-muted">${m.osca}</td>
          <td class="td-bold">${m.name}</td>
          <td class="td-muted">${m.age}</td><td class="td-muted">${m.sex}</td>
          <td class="td-muted">${m.brgy}</td><td class="td-muted">${m.civil}</td>
          <td>${milestoneCell}</td>
          <td><span class="badge ${meta.badge}">${meta.label}</span></td>
          <td><button class="btn btn-ghost btn-sm btn-icon" onclick="location.href='member-detail.html?id=${encodeURIComponent(m.osca)}'" title="View"><i class="ti ti-eye"></i></button></td>
        </tr>`;
    }).join('');
  }

  function exportMembers() {
    const headers = ['OSCA ID', 'Name', 'Age', 'Sex', 'Barangay', 'Civil Status', 'Milestone', 'Reg. Status'];
    const csvRows = members.map(m => [
      m.osca, m.name, m.age, m.sex, m.brgy, m.civil, m.milestone || '', regMeta[m.reg].label
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...csvRows].join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'members-export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  renderTable();
</script>
</body>
</html>
