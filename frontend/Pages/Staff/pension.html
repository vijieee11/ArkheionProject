<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Pension Tracking</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;}
    /* Instant hover tooltip — no native-title delay */
    .tooltip{position:relative;}
    .tooltip::after{
      content:attr(data-tooltip);
      position:absolute;
      bottom:calc(100% + 6px);
      left:50%;
      transform:translateX(-50%);
      background:var(--navy,#1f2937);
      color:#fff;
      font-size:11px;
      line-height:1;
      padding:5px 8px;
      border-radius:4px;
      white-space:nowrap;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .1s ease;
      z-index:30;
    }
    .tooltip:hover::after{opacity:1;visibility:visible;}
    .tooltip::before{
      content:'';
      position:absolute;
      bottom:100%;
      left:50%;
      transform:translateX(-50%);
      border:5px solid transparent;
      border-top-color:var(--navy,#1f2937);
      opacity:0;
      visibility:hidden;
      transition:opacity .1s ease;
      z-index:31;
    }
    .tooltip:hover::before{opacity:1;visibility:visible;}
  </style>
</head>
<body>
<script src="sidebar.js"></script>
<script src="../api.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="pension-title">Social pension records</span>
    <div class="topbar-actions" style="margin-left:auto;">
      <button class="btn btn-ghost btn-sm" onclick="exportPayroll()"><i class="ti ti-download"></i> Export payroll</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid stats-3">
      <div class="stat-card amber">
        <div class="stat-label"><i class="ti ti-circle-check"></i> Claimed</div>
        <div class="stat-value" id="stat-claimed-count">—</div>
        <div class="stat-sub" id="stat-claimed-total">Loading pension records…</div>
      </div>
      <div class="stat-card coral">
        <div class="stat-label"><i class="ti ti-clock"></i> Unclaimed</div>
        <div class="stat-value" id="stat-unclaimed-count">—</div>
        <div class="stat-sub" id="stat-unclaimed-total">Loading pension records…</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="ti ti-cash"></i> Amount per member</div>
        <div class="stat-value" style="font-size:20px;">₱500</div>
        <div class="stat-sub">Monthly social pension (DSWD)</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Pension claim records</div>
          <div class="card-subtitle">Records loaded from the OSCA database</div>
        </div>
        <div class="card-actions">
          <select id="filter-brgy" class="filter-select" data-arkheion-barangay="filter" onchange="renderTable()">
            <option>All barangays</option>
          </select>
          <select id="filter-status" class="filter-select" onchange="renderTable()">
            <option>All status</option>
            <option>Claimed</option><option>Unclaimed</option>
          </select>
          <select id="filter-period" class="filter-select" onchange="renderTable()" aria-label="Filter by pension period">
            <option value="">All periods</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>OSCA ID</th><th>Name</th><th>Barangay</th><th>Amount</th><th>Status</th><th>Date claimed</th><th>Claimed by</th><th>Action</th></tr>
        </thead>
        <tbody id="pension-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-claim" onclick="if(event.target===this)closeModal('modal-claim')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Mark pension as claimed</span>
      <button class="modal-close" onclick="closeModal('modal-claim')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>Senior citizen</label><input type="text" id="claim-name" value="" readonly></div>
      <div class="form-group"><label>Amount</label><input type="text" id="claim-amount" value="" readonly></div>
      <div class="form-2col">
        <div class="form-group"><label>Date claimed</label><input type="date" id="claim-date"></div>
        <div class="form-group"><label>Claimed by</label><select id="claim-by"><option value="self">Self</option><option value="representative">Authorized representative</option></select></div>
      </div>
      <div class="form-group"><label>Representative name (if applicable)</label><input type="text" id="claim-representative" maxlength="200" placeholder="Name of authorized representative"></div>
      <div class="form-group"><label>Remarks (optional)</label><textarea id="claim-remarks" placeholder="Any notes..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-claim')">Cancel</button>
      <button class="btn btn-navy" onclick="confirmClaim()"><i class="ti ti-check"></i> Confirm claimed</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  renderSidebar('pension');
  const records = [];
  let activeRecordId = null;
  let pageHasError = false;
  const statusMeta = {
    claimed: { badge: 'badge-ok', label: 'Claimed' },
    unclaimed: { badge: 'badge-pend', label: 'Unclaimed' },
  };

  function unwrapList(value) {
    return Array.isArray(value) ? value : (Array.isArray(value?.results) ? value.results : []);
  }

  function peso(value) {
    const amount = Number(value) || 0;
    return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', maximumFractionDigits: 2 }).format(amount);
  }

  function formatDate(value) {
    if (!value) return '—';
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat('en-PH', { dateStyle: 'medium' }).format(date);
  }

  function periodLabel(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{1,2})$/);
    if (!match) return value || 'Unspecified period';
    return new Intl.DateTimeFormat('en-PH', { month: 'long', year: 'numeric' }).format(new Date(Number(match[1]), Number(match[2]) - 1, 1));
  }

  function getFilteredRecords() {
    const brgy = document.getElementById('filter-brgy').value;
    const status = document.getElementById('filter-status').value;
    const period = document.getElementById('filter-period').value;
    return records.filter(record =>
      (brgy === 'All barangays' || record.brgy === brgy) &&
      (status === 'All status' || statusMeta[record.status]?.label === status) &&
      (!period || record.period === period)
    );
  }

  function renderStats(rows) {
    const claimed = rows.filter(record => record.status === 'claimed');
    const unclaimed = rows.filter(record => record.status === 'unclaimed');
    document.getElementById('stat-claimed-count').textContent = claimed.length;
    document.getElementById('stat-claimed-total').textContent = `${peso(claimed.reduce((sum, record) => sum + record.amount, 0))} total released`;
    document.getElementById('stat-unclaimed-count').textContent = unclaimed.length;
    document.getElementById('stat-unclaimed-total').textContent = `${peso(unclaimed.reduce((sum, record) => sum + record.amount, 0))} pending`;
  }

  function renderTable() {
    const body = document.getElementById('pension-rows');
    const rows = getFilteredRecords();
    body.replaceChildren();
    renderStats(rows);
    const selectedPeriod = document.getElementById('filter-period').value;
    document.getElementById('pension-title').textContent = selectedPeriod
      ? `Social pension — ${periodLabel(selectedPeriod)}`
      : 'Social pension records';

    if (!rows.length) {
      const row = body.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 8;
      cell.style.textAlign = 'center';
      cell.style.padding = '24px';
      cell.textContent = pageHasError
        ? 'Pension records could not be loaded. Check your connection and refresh the page.'
        : 'No pension records match these filters. Records will appear here after they are saved to the database.';
      return;
    }

    rows.forEach(record => {
      const row = body.insertRow();
      const values = [record.osca, record.name, record.brgy || '—', peso(record.amount)];
      values.forEach((value, index) => {
        const cell = row.insertCell();
        cell.textContent = value;
        cell.className = index === 1 ? 'td-bold' : 'td-muted';
      });
      const statusCell = row.insertCell();
      const badge = document.createElement('span');
      badge.className = `badge ${statusMeta[record.status].badge}`;
      badge.textContent = statusMeta[record.status].label;
      statusCell.appendChild(badge);
      row.insertCell().textContent = formatDate(record.dateClaimed);
      row.insertCell().textContent = record.claimedBy || '—';
      const actionCell = row.insertCell();
      if (record.status === 'unclaimed') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-navy btn-sm';
        button.innerHTML = '<i class="ti ti-check"></i> Mark claimed';
        button.addEventListener('click', () => openClaimModal(record.id));
        actionCell.appendChild(button);
      } else {
        actionCell.textContent = '—';
      }
    });
  }

  async function loadPensionRecords() {
    pageHasError = false;
    const body = document.getElementById('pension-rows');
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px">Loading pension records…</td></tr>';
    try {
      await ArkheionAPI.populateBarangaySelects();
      const [seniorResponse, pensionResponse] = await Promise.all([
        ArkheionAPI.get('/api/seniors/'),
        ArkheionAPI.get('/api/pensions/'),
      ]);
      const seniors = unwrapList(seniorResponse);
      const seniorById = new Map(seniors.map(senior => [String(senior.id), senior]));
      const pensionRows = unwrapList(pensionResponse);
      records.splice(0, records.length, ...pensionRows.map(item => {
        const senior = seniorById.get(String(item.senior_citizen)) || {};
        return {
          id: item.id,
          seniorId: item.senior_citizen,
          osca: item.senior_osca_id || senior.osca_id || '—',
          name: item.senior_name || [senior.first_name, senior.last_name].filter(Boolean).join(' ') || 'Unknown senior',
          brgy: senior.barangay_name || senior.barangay || '',
          amount: Number(item.amount) || 0,
          status: item.claimed ? 'claimed' : 'unclaimed',
          dateClaimed: item.date_claimed || '',
          claimedBy: item.claimed ? (item.claimed_by === 'self' ? 'Self' : item.representative || 'Authorized representative') : '',
          period: item.period || '',
          remarks: item.remarks || '',
        };
      }));
      const periodSelect = document.getElementById('filter-period');
      const previousPeriod = periodSelect.value;
      periodSelect.replaceChildren(new Option('All periods', ''));
      [...new Set(records.map(record => record.period).filter(Boolean))]
        .sort((a, b) => b.localeCompare(a))
        .forEach(period => periodSelect.add(new Option(periodLabel(period), period)));
      if ([...periodSelect.options].some(option => option.value === previousPeriod)) periodSelect.value = previousPeriod;
      renderTable();
    } catch (error) {
      pageHasError = true;
      renderTable();
      showToast(error.message || 'Could not load pension records.', 'error');
    }
  }

  function openClaimModal(recordId) {
    const record = records.find(item => item.id === recordId);
    if (!record) return;
    activeRecordId = recordId;
    document.getElementById('claim-name').value = `${record.name} — ${record.osca}`;
    document.getElementById('claim-amount').value = peso(record.amount);
    document.getElementById('claim-date').value = new Date().toISOString().slice(0, 10);
    document.getElementById('claim-by').value = 'self';
    document.getElementById('claim-representative').value = '';
    document.getElementById('claim-remarks').value = record.remarks;
    openModal('modal-claim');
  }

  async function confirmClaim() {
    const record = records.find(item => item.id === activeRecordId);
    if (!record) { closeModal('modal-claim'); return; }
    const button = document.querySelector('#modal-claim .modal-footer .btn-navy');
    const claimedBy = document.getElementById('claim-by').value;
    const representative = document.getElementById('claim-representative').value.trim();
    if (claimedBy === 'representative' && !representative) {
      showToast('Enter the authorized representative name.', 'error');
      return;
    }
    button.disabled = true;
    try {
      await ArkheionAPI.patch(`/api/pensions/${record.id}/`, {
        claimed: true,
        date_claimed: document.getElementById('claim-date').value || new Date().toISOString().slice(0, 10),
        claimed_by: claimedBy,
        representative: claimedBy === 'representative' ? representative : '',
        remarks: document.getElementById('claim-remarks').value.trim(),
      });
      closeModal('modal-claim');
      showToast(`Pension claim saved for ${record.name}.`);
      await loadPensionRecords();
    } catch (error) {
      showToast(error.message || 'Could not save the pension claim.', 'error');
    } finally {
      button.disabled = false;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function exportPayroll() {
    const rows = getFilteredRecords();
    if (!rows.length) {
      showToast('Nothing to export.');
      return;
    }
    const headers = ['OSCA ID', 'Name', 'Barangay', 'Amount', 'Status', 'Date Claimed', 'Claimed By'];
    const csvRows = rows.map(r => [
      r.osca, r.name, r.brgy, r.amount, statusMeta[r.status].label, r.dateClaimed || '', r.claimedBy || ''
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...csvRows].join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const period = document.getElementById('filter-period').value || 'all-periods';
    a.download = `pension-payroll-${period}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    showToast(`Exported ${rows.length} record${rows.length === 1 ? '' : 's'}.`);
  }

  document.getElementById('claim-by').addEventListener('change', event => {
    document.getElementById('claim-representative').closest('.form-group').hidden = event.target.value !== 'representative';
  });
  document.getElementById('claim-representative').closest('.form-group').hidden = true;
  loadPensionRecords();
</script>
</body>
</html>
