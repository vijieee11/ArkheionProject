<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkheion — Search Records</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{display:flex;}
    mark.hl{background:var(--teal-100, #b7ebe4);color:inherit;padding:0 1px;border-radius:2px;}
    /* Status badge colors — separate from the existing badge-ok/badge-proc
       (those stay as-is for the NLP Classification column). */
    .badge-warn{background:#fff3e0;color:#b06a00;}
    .badge-info{background:#e3f2fd;color:#1565c0;}
    .badge-danger{background:#fde8e8;color:#c0392b;}
    /* Instant hover tooltip — no native-title delay */
    .tooltip{position:relative;}
    .tooltip::after{
      content:attr(data-tooltip);
      position:absolute;
      bottom:calc(100% + 6px);
      left:50%;
      transform:translateX(-50%);
      background:var(--navy,#1f2937);
      color:#fff;
      font-size:11px;
      line-height:1;
      padding:5px 8px;
      border-radius:4px;
      white-space:nowrap;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .1s ease;
      z-index:30;
    }
    .tooltip:hover::after{opacity:1;visibility:visible;}
  </style>
</head>
<body>
<script src="sidebar.js"></script>
<script src="../api.js"></script>
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Search records</span>
  </div>

  <div class="content">
    <div class="card" style="padding:16px;">
      <div style="display:flex;align-items:center;gap:10px;background:var(--teal-50);border:1.5px solid var(--teal-100);border-radius:var(--radius);padding:0 14px;height:46px;margin-bottom:12px;">
        <i class="ti ti-search" style="font-size:18px;color:var(--navy)"></i>
        <input id="main-search" type="text" placeholder="Search by name, barangay, year, OSCA ID, or document type..." style="border:none;background:none;outline:none;font-size:14px;color:var(--navy);flex:1;font-family:var(--font-body);" oninput="doSearch()" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-navy" onclick="doSearch()">Search</button>
      </div>
      <div class="filter-bar">
        <select id="filter-type" class="filter-select" onchange="doSearch()">
          <option>All document types</option>
          <option>OSCA Form No. 1</option>
          <option>PSA Birth Certificate</option>
          <option>PhilSys ID</option>
          <option>NCSC Annex A</option>
          <option>Medicine booklet</option>
        </select>
        <select id="filter-brgy" class="filter-select" data-arkheion-barangay="filter" onchange="doSearch()">
          <option>All barangays</option>
        </select>
        <select id="filter-year" class="filter-select" onchange="doSearch()">
          <option>All years</option>
          <option>2026</option><option>2025</option><option>2024</option><option>2023</option>
        </select>
        <select id="filter-status" class="filter-select" onchange="doSearch()">
          <option>All status</option>
          <option>Verified</option><option>Pending</option><option>Rejected</option><option>No document</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()"><i class="ti ti-x"></i> Clear</button>
      </div>
    </div>

    <div class="card" id="results-card">
      <div class="card-header">
        <div>
          <div class="card-title" id="results-title">Search results</div>
          <div class="card-subtitle" id="results-sub">Enter a query above to search records</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="exportResults()"><i class="ti ti-download"></i> Export results</button>
      </div>
      <div id="results-body">
        <div class="empty-state">
          <i class="ti ti-search"></i>
          <h4>Start your search</h4>
          <p>Type a name, OSCA ID, barangay, or document type above to find records.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  renderSidebar('search');
  ArkheionAPI.populateBarangaySelects().catch(error => showToast(error.message || 'Could not load barangays.', 'error'));
  let searchRecords = [];
  let lastResults = [];

  function asList(data) { return Array.isArray(data) ? data : (data && Array.isArray(data.results) ? data.results : []); }
  function seniorName(s) { return [s.first_name, s.middle_name, s.last_name, s.suffix].filter(Boolean).join(' '); }
  function documentStatus(doc) {
    if (doc.review_status === 'verified' || doc.is_verified) return 'Verified';
    if (doc.review_status === 'rejected') return 'Rejected';
    return 'Pending';
  }
  async function loadSearchRecords() {
    const results = await Promise.all([ArkheionAPI.get('/api/seniors/'), ArkheionAPI.get('/api/documents/')]);
    const seniors = asList(results[0]);
    const documents = asList(results[1]);
    searchRecords = seniors.flatMap(senior => {
      const name = seniorName(senior);
      const memberDocs = documents.filter(doc => Number(doc.senior_citizen) === Number(senior.id));
      const rows = memberDocs.length ? memberDocs : [null];
      return rows.map(doc => {
        const date = doc && (doc.upload_date || doc.created_at);
        return {
          seniorId: senior.id, osca: senior.osca_id || '', name, brgy: senior.barangay_name || '',
          type: doc ? doc.document_type : 'No document uploaded',
          cls: doc && doc.nlp_classification ? doc.nlp_classification : 'Not classified',
          year: date ? String(date).slice(0, 4) : '',
          statusLabel: doc ? documentStatus(doc) : 'No document',
          documentId: doc && doc.id,
        };
      });
    });
    const typeSelect = document.getElementById('filter-type');
    const types = [...new Set(searchRecords.map(row => row.type).filter(type => type && type !== 'No document uploaded'))].sort();
    typeSelect.replaceChildren(new Option('All document types', 'All document types'), ...types.map(type => new Option(type, type)));
    const yearSelect = document.getElementById('filter-year');
    const years = [...new Set(searchRecords.map(row => row.year).filter(Boolean))].sort().reverse();
    yearSelect.replaceChildren(new Option('All years', 'All years'), ...years.map(year => new Option(year, year)));
    doSearch();
  }
  loadSearchRecords().catch(error => {
    document.getElementById('results-sub').textContent = 'Could not load records from the API.';
    document.getElementById('results-body').innerHTML = `<div class="empty-state"><h4>Records unavailable</h4><p>${escapeHtml(error.message || 'Could not load records.')}</p></div>`;
    showToast(error.message || 'Could not load records.', 'error');
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Wraps every case-insensitive occurrence of `query` inside `text` with <mark>.
  // Text is HTML-escaped first so a matched value can never inject markup.
  function highlight(text, query) {
    const safe = escapeHtml(text);
    if (!query) return safe;
    const re = new RegExp('(' + escapeRegex(query) + ')', 'ig');
    return safe.replace(re, '<mark class="hl">$1</mark>');
  }

  // Reads the search box + all four filter dropdowns and returns the matching rows.
  // Name/OSCA/brgy/type all use partial, case-insensitive matching, so a single
  // letter like "j" already matches everything starting with or containing "j".
  function getFilteredResults() {
    const q = document.getElementById('main-search').value.trim().toLowerCase();
    const docType = document.getElementById('filter-type').value;
    const brgy = document.getElementById('filter-brgy').value;
    const year = document.getElementById('filter-year').value;
    const status = document.getElementById('filter-status').value;

    return searchRecords.filter(r => {
      const matchesQuery = !q ||
        r.name.toLowerCase().includes(q) ||
        r.osca.toLowerCase().includes(q) ||
        r.brgy.toLowerCase().includes(q) ||
        r.year.includes(q) ||
        r.type.toLowerCase().includes(q);
      const matchesType   = docType === 'All document types' || r.type === docType;
      const matchesBrgy   = brgy === 'All barangays' || r.brgy === brgy;
      const matchesYear   = year === 'All years' || r.year === year;
      const matchesStatus = status === 'All status' || r.statusLabel === status;
      return matchesQuery && matchesType && matchesBrgy && matchesYear && matchesStatus;
    });
  }

  // Match badge colors to the review status returned by the document API.
  function statusClass(label) {
    switch (label) {
      case 'Verified': return 'badge-ok';
      case 'Pending': return 'badge-info';
      case 'Rejected': return 'badge-danger';
      default: return 'badge-proc';
    }
  }

  function anyFilterActive() {
    return document.getElementById('filter-type').value !== 'All document types' ||
           document.getElementById('filter-brgy').value !== 'All barangays' ||
           document.getElementById('filter-year').value !== 'All years' ||
           document.getElementById('filter-status').value !== 'All status';
  }

  function doSearch() {
    const q = document.getElementById('main-search').value.trim();

    // Nothing typed and no filter picked yet — stay on the start state.
    if (!q && !anyFilterActive()) {
      document.getElementById('results-title').textContent = 'Search results';
      document.getElementById('results-sub').textContent = 'Enter a query above to search records';
      document.getElementById('results-body').innerHTML = `
        <div class="empty-state">
          <i class="ti ti-search"></i>
          <h4>Start your search</h4>
          <p>Type a name, OSCA ID, barangay, or document type above to find records.</p>
        </div>`;
      lastResults = [];
      return;
    }

    const results = getFilteredResults();
    lastResults = results;

    const label = q ? `"${q}"` : 'the selected filters';
    document.getElementById('results-title').textContent = 'Search results';
    document.getElementById('results-sub').textContent = `Showing ${results.length} result${results.length === 1 ? '' : 's'} for ${label}`;

    if (results.length === 0) {
      document.getElementById('results-body').innerHTML = `
        <div class="empty-state">
          <i class="ti ti-search-off"></i>
          <h4>No records found</h4>
          <p>Try a different name, OSCA ID, or loosen the filters above.</p>
        </div>`;
      return;
    }

    const rows = results.map(r => `
      <tr style="cursor:pointer" onclick="location.href='member-detail.html?id=${encodeURIComponent(r.osca)}'">
        <td class="td-muted">${highlight(r.osca, q)}</td>
        <td class="td-bold">${highlight(r.name, q)}</td>
        <td class="td-muted">${highlight(r.type, q)}</td>
        <td><span class="badge ${statusClass(r.statusLabel)}">${escapeHtml(r.cls)}</span></td>
        <td class="td-muted">${highlight(r.brgy, q)}</td>
        <td class="td-muted">${highlight(r.year, q)}</td>
        <td><span class="badge ${statusClass(r.statusLabel)}">${r.statusLabel}</span></td>
        <td><button class="btn btn-ghost btn-sm btn-icon tooltip" data-tooltip="View" onclick="event.stopPropagation();location.href='member-detail.html?id=${encodeURIComponent(r.osca)}'"><i class="ti ti-eye"></i></button></td>
      </tr>`).join('');

    document.getElementById('results-body').innerHTML = `
      <table>
        <thead><tr><th>OSCA ID</th><th>Name</th><th>Document</th><th>NLP Classification</th><th>Brgy</th><th>Year</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function clearFilters() {
    document.getElementById('main-search').value = '';
    document.getElementById('filter-type').value = 'All document types';
    document.getElementById('filter-brgy').value = 'All barangays';
    document.getElementById('filter-year').value = 'All years';
    document.getElementById('filter-status').value = 'All status';
    lastResults = [];
    document.getElementById('results-title').textContent = 'Search results';
    document.getElementById('results-sub').textContent = 'Enter a query above to search records';
    document.getElementById('results-body').innerHTML = `
      <div class="empty-state">
        <i class="ti ti-search"></i>
        <h4>Start your search</h4>
        <p>Type a name, OSCA ID, barangay, or document type above to find records.</p>
      </div>`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function exportResults() {
    const results = lastResults.length ? lastResults : getFilteredResults();
    if (!results.length) {
      showToast('No results to export — run a search first.');
      return;
    }

    const headers = ['OSCA ID', 'Name', 'Document', 'NLP Classification', 'Brgy', 'Year', 'Status'];
    const csvRows = results.map(r => [r.osca, r.name, r.type, r.cls, r.brgy, r.year, r.statusLabel]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...csvRows].join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `search-results-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    showToast(`Exported ${results.length} record${results.length === 1 ? '' : 's'}.`);
  }
</script>
</body>
</html>
